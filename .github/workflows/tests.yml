name: ParaBank Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run test suite (UI + API)
        run: >
          pytest
          --browser chromium
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output=reports/test-results

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --no-progress
          allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          retention-days: 14

      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: reports/test-results
          retention-days: 14

      # Publishes the Allure HTML report to the gh-pages branch so it's
      # viewable at https://<user>.github.io/<repo>/ after every main build.
      # Requires GitHub Pages enabled for this repo, source: gh-pages branch.
      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
